# @read-frog/api-contract 依赖 @orpc/contract@^1.14.6，本项目的 @orpc/server 是
# 1.15.0。两份 @orpc/contract 同时存在时，契约里的类型和 implement() 期望的类型
# 虽然结构一致却互不认账，导致 router.ts / srs-router.ts 出现大量
# "not callable" 与 handler 不匹配的类型错误。统一到一个版本即可消除。
overrides:
  "@orpc/contract": ^1.15.0

minimumReleaseAge: 0

shellEmulator: true

trustPolicy: no-downgrade

trustPolicyExclude:
  - react-redux@9.2.0
  - reselect@5.1.1
  - semver@6.3.1

allowBuilds:
  core-js: true
  esbuild: true
  msw: true
  nx: true
  spawn-sync: true
